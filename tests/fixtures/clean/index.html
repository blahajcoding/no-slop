<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledger 2026 field notes</title>
  <meta name="description" content="Field notes from the 2026 shelf survey.">
  <meta property="og:title" content="Ledger 2026 field notes">
  <meta property="og:image" content="/og.png">
  <link rel="icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700" rel="stylesheet">
  <style>
    :root { --rule: #e5e7eb; --ink: #16181d; --paper: #fbfaf7; }
    * { box-sizing: border-box; }
    body {
      font-family: Bitter, Georgia, serif;
      color: var(--ink);
      background: var(--paper);
      margin: 0;
      padding: 24px;
      pointer-events: auto;
      container-name: interface;
    }
    .row { border: 1px solid var(--rule); padding: 12px 16px; }
    .btn { border-radius: 2px; }
    .chip { border-radius: 8px; }
    .dot { border-radius: 50%; }
    a:focus-visible, .btn:focus-visible { outline: 2px solid #16181d; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    .btn { transition: background-color 120ms linear; }
  </style>
</head>
<body>
  <h1>Ledger 2026 field notes</h1>
  <p>Measured off the shelf, one row per site.</p>
  <div class="row"><a class="btn" href="/buy">Buy the 2026 ledger, $38</a></div>
  <table><tr><td>1</td><td>2</td><td>3</td></tr></table>
  <footer><p>&copy; 2026 Shelf Survey</p></footer>
</body>
</html>
