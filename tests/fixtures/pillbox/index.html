<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Status board</title>
  <meta name="description" content="Board.">
  <meta property="og:title" content="Status board">
  <meta property="og:image" content="/og.png">
  <link rel="icon" href="/favicon.svg">
  <style>
    body { font-family: Bitter, Georgia, serif; color: #16181d; background: #fbfaf7; margin: 0; padding: 24px; }
    .kicker { background: #fff; border: 1px solid #e5e7eb; border-radius: 999px; display: inline-flex; gap: 8px; padding: 6px 12px; }
    .kicker__dot { background: #1e6b55; width: 8px; height: 8px; border-radius: 50%; }
    .svc__ico { background: #eee; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
    .device__ico { background: #eee; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
    a:focus-visible { outline: 2px solid #16181d; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Status board</h1>
  <p class="kicker"><span class="kicker__dot"></span>All systems nominal</p>
  <div class="svc__ico"></div>
  <div class="device__ico"></div>
  <footer><p>&copy; 2026 Status board</p></footer>
</body>
</html>
