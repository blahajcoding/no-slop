<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mono scope</title>
<meta name="description" content="Mono scope fixture.">
<meta property="og:title" content="Mono scope"><meta property="og:image" content="/og.png">
<link rel="icon" href="/favicon.svg">
<style>
body{font-family:Bitter,serif;color:#16181d;background:#fbfaf7;padding:24px}
code,pre{font-family:ui-monospace,SFMono-Regular,monospace}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{padding:16px;border:1px solid #e5e7eb;border-radius:4px}

<body><h1>Mono scope</h1>
<pre><code>npm run build</code></pre>
<div class="wrap">
  <div class="card"><p>First card, not nested.</p></div>
  <div class="card"><p>Second card, a sibling.</p></div>
</div>
